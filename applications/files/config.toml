# Global Rust compiler flags
[target.'cfg(all())']
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = [
    "-C", "symbol-mangling-version=v0",
    "--cfg", "tokio_unstable",

    # HPC: GCC 12.5 C++ runtime and library search path
    "-L", "native=/usr/local/Cluster-Apps/ceuadmin/gcc/12.5.0/lib64",
    "-C", "link-arg=-Wl,-rpath,/usr/local/Cluster-Apps/ceuadmin/gcc/12.5.0/lib64",
]

# Cargo aliases
[alias]
xtask = "run --package xtask --"
perf-test = [
    "test", "--profile", "release-fast",
    "--lib", "--bins", "--tests", "--all-features",
    "--config", "target.'cfg(true)'.runner='cargo run -p perf --release'",
    "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]"
]
# Keep similar flags here to share some ccache
perf-compare = [
    "run", "--profile", "release-fast", "-p", "perf",
    "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]",
    "--", "compare"
]

# Windows-specific settings
[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # Reduce windows::core::Error size
    "-C",
    "target-feature=+crt-static", # Fix LiveKit static linking
]

# We need lld to link libwebrtc.a successfully on aarch64-linux
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Environment variables
[env]
MACOSX_DEPLOYMENT_TARGET = "12.0"
